<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" role="img" aria-labelledby="title desc">
  <title id="title">Artificial Intelligence Certificate</title>
  <desc id="desc">Portfolio-style thumbnail for the Artificial Intelligence certification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f7be6"/>
      <stop offset="55%" stop-color="#7a66cc"/>
      <stop offset="100%" stop-color="#804fa5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7869ea"/>
      <stop offset="100%" stop-color="#5d55c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="842" height="595" rx="28" fill="url(#bg)"/>
  <circle cx="740" cy="88" r="74" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="126" cy="512" r="118" fill="#ffffff" fill-opacity="0.06"/>

