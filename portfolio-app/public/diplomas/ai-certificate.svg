    <rect x="313" y="132" width="34" height="34" rx="8" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="330" cy="149" r="9" fill="#eef2ff" fill-opacity="0.82"/>
    <path d="M326 137l10 4 10-4-10-4-10 4Zm10 6-7-3v7l7 3 7-3v-7l-7 3Z" fill="#eef2ff" fill-opacity="0.9" transform="translate(0 0) scale(0.9)"/>

    <text x="362" y="149" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Artificial Intelligence</text>
    <text x="362" y="167" fill="#e2e8f0" fill-opacity="0.82" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="500">Rocketseat</text>

